<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Swarm Survival — 12-Module Demo</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #181b22;
      --border: #2a2f3a;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #00ffcc;
      --pink: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem 1.5rem;
      user-select: none;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .topbar a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    input[type="text"] {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.65rem;
      border-radius: 4px;
      font-family: monospace;
      width: 150px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #0b0e14;
      border-color: var(--accent);
      font-weight: 700;
    }
    .workspace {
      display: grid;
      grid-template-columns: 800px 1fr;
      gap: 1rem;
      align-items: start;
    }
    .stage-wrap {
      position: relative;
      width: 800px;
      height: 540px;
      border: 1px solid var(--border);
      background: #0a0c10;
      overflow: hidden;
      border-radius: 6px;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 16, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 2rem; margin-bottom: 0.5rem; color: var(--accent); }
    .overlay p { color: var(--muted); margin-bottom: 1.25rem; max-width: 460px; }
    .upgrade-grid {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .upgrade-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 8px;
      width: 190px;
      text-align: left;
      transition: transform 0.12s, border-color 0.12s;
    }
    .upgrade-btn:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .upgrade-btn h4 { color: var(--accent); margin-bottom: 0.35rem; font-size: 1rem; }
    .upgrade-btn span { font-size: 0.82rem; color: var(--muted); display: block; }
    .telemetry {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .hint {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <a href="/">← Back to Hub</a>
      <strong style="margin-left: 1rem;">Swarm Survival (All 12 Modules)</strong>
    </div>
    <div class="controls-bar">
      <label for="seedInput" style="font-size:0.85rem; color:var(--muted);">Seed:</label>
      <input type="text" id="seedInput" value="miku-39" />
      <button id="replaySeedBtn" class="primary">Restart (Same Seed)</button>
      <button id="randomSeedBtn">New Random Seed</button>
      <button id="autoFireBtn">Auto-Fire: ON</button>
    </div>
  </div>

  <div class="workspace">
    <div>
      <div class="stage-wrap">
        <canvas id="gameCanvas" width="800" height="540"></canvas>
        <div id="overlay" class="overlay hidden"></div>
      </div>
      <p class="hint">
        <strong>Controls:</strong> WASD / Arrows = Move &nbsp;|&nbsp; Mouse = Aim &nbsp;|&nbsp;
        Left Click / Space = Shoot &nbsp;|&nbsp; Shift = Dash &nbsp;|&nbsp; Q / E = Zoom Camera
      </p>
    </div>

    <div class="telemetry" id="telemetry">Initializing modules...</div>
  </div>

  <script type="module" src="./js/swarm-demo.js"></script>
</body>
</html>
